name: Refresh price data

on:
  schedule:
    # Saturdays 06:00 UTC — after Friday's US market close, matches the
    # live bot's own Friday rebalancing cadence (top1_live_bot/config.py).
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas

      - run: python scripts/refresh_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/top1_history.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Weekly price data refresh"
          git push
